const bar=p=>`<div class="bar ${p===100?'ok':''}"><i style="width:${p}%"></i></div>`;

function toggle(id,k){const l=L(id);l[k]=l[k]?0:1;touch(id);save()}
function main(id){const l=L(id);if(pr(id)===100){ACT.forEach(a=>l[a[0]]=0);touch(id);save()}else if(confirm('Mark all four activities as completed?')){ACT.forEach(a=>l[a[0]]=1);touch(id);save()}}
function row(l){const p=pr(l.id),o=open[l.id];
return `<div class="lr"><div class="lh"><input type="checkbox" class="m" ${p===100?'checked':''} data-main="${l.id}" aria-label="Complete ${esc(l.n)}">
<span class="t" data-det="${l.id}">${esc(l.n)}${l.v?'<span class="tag">verify</span>':''}<span class="mu"> · ${p}%</span></span>
<span class="acts">${ACT.map(a=>`<span class="a ${L(l.id)[a[0]]?'on':''}" data-tg="${l.id}|${a[0]}">${a[1]} ${a[2]}</span>`).join('')}</span>

function pass(l){const p=pr(l.id);if(q&&!l.n.toLowerCase().includes(q.toLowerCase()))return false;
if(flt==='done'&&p!==100)return false;if(flt==='todo'&&p===100)return false;if(flt==='prog'&&!(p>0&&p<100))return false;

<h3>Subjects</h3><div class="g g3">${SYL.map(s=>{const p=sp(s);return `<div class="c nt n${s.id}"><div style="font-size:28px">${s.icon}</div><b>${s.name}</b><div class="mu">${sd(s)} / ${s.lessons.length} lessons</div>${bar(p)}<div class="mu">${p}% completed</div><button class="b p" style="margin-top:8px" data-go="${s.id}">Open</button></div>`}).join('')}</div>

function render(){const s=SYL.find(x=>x.id===view);

const f=document.getElementById('fl');if(f)f.value=flt;const a=document.getElementById('af');if(a)a.value=actF}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-main],[data-tg],[data-det],[data-ex],[data-all],[data-set],[data-close],[data-sv],#th,#ex,#im,#rs');if(!t)return;const D=t.dataset;

else if(D.main)main(D.main);

else if(D.det){modal=D.det;render()}

else if(D.sv){const l=L(D.sv);l.notes=document.getElementById('nt').value;l.links=document.getElementById('lk').value;touch(D.sv);Store.save(S);modal=null;render()}
